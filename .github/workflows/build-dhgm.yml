# DHGM APK build — ATAK-CIV-ის ოფიციალური assemble CI-ის ადაპტაცია.
# ლოკალურად macOS-ზე ეს build შეუძლებელია (NDK r12b / takthirdparty = Linux-only),
# ამიტომ GCS-ის ანალოგიით: overlay ლოკალურად ვითარდება, APK აქ იწყობა.
#
# Container-ის გარეშე ვმუშაობთ (host runner + setup-java temurin 8):
# ATAK-ის 3-არქიტექტურიან native build-ს ~30GB სჭირდება, runner-ს კი ~14GB აქვს —
# ბალასტის წაშლა (dotnet, preinstalled Android, ghc…) მხოლოდ host-ზეა შესაძლებელი.
#
# საჭირო Secrets (repo Settings → Secrets and variables → Actions):
#   DHGM_KEYSTORE_B64  — base64 < custom/keys/dhgm.keystore
#   DHGM_KEYSTORE_PASS — პაროლი custom/keys/keystore.properties-დან
name: Build DHGM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['custom/**', 'tools/apply-dhgm-overlay.sh', '.github/workflows/build-dhgm.yml']

env:
  ATAK_REF: "4.6.0.5"   # ATAK-CIV-ის pinned stable tag (default branch = main; გაზარდე შეგნებულად, ტესტით)

jobs:
  build:
    name: Assemble DHGM (CIV base)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space (runner ballast)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Checkout DHGM (overlay)
        uses: actions/checkout@v4

      - name: Checkout ATAK-CIV
        run: |
          git lfs install
          git clone --depth 1 --branch "$ATAK_REF" --recurse-submodules \
            https://github.com/deptofdefense/AndroidTacticalAssaultKit-CIV.git atak
          cd atak && git lfs fetch && git lfs checkout

      - name: Apply DHGM overlay
        run: ./tools/apply-dhgm-overlay.sh

      - name: Set up Python 3.10 (conan 1.59 + PyYAML wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ant apg dos2unix autoconf automake g++ libtool patch make cmake ninja-build swig tcl unzip wget
          # conan venv-ში Python 3.10-ით — 3.12-ზე PyYAML წყაროდან ვერ იწყობა (Cython 3)
          python3.10 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install -q -U pip setuptools
          "$HOME/conan-venv/bin/pip" install -q conan==1.59.0
          echo "$HOME/conan-venv/bin" >> $GITHUB_PATH
          echo "ANDROID_COMPILE_SDK=29" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=29.0.3" >> $GITHUB_ENV
          echo "ANDROID_SDK_TOOLS=4333796" >> $GITHUB_ENV
          echo "NDK_VERSION=12b" >> $GITHUB_ENV

      - name: Set up Android SDK
        run: |
          wget --quiet --tries=0 --output-document=android-sdk.zip https://dl.google.com/android/repository/sdk-tools-linux-${ANDROID_SDK_TOOLS}.zip
          unzip -qq -d android-sdk-linux android-sdk.zip
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          echo y | android-sdk-linux/tools/bin/sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" >/dev/null
          echo y | android-sdk-linux/tools/bin/sdkmanager "platform-tools" >/dev/null
          echo y | android-sdk-linux/tools/bin/sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null
          echo "ANDROID_HOME=$PWD/android-sdk-linux" >> $GITHUB_ENV
          # host image-ის preset ANDROID_SDK_ROOT წაშლილ /usr/local/lib/android-ზე მიუთითებს
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk-linux" >> $GITHUB_ENV
          echo "$PWD/android-sdk-linux/platform-tools/" >> $GITHUB_PATH
          set +o pipefail
          yes | android-sdk-linux/tools/bin/sdkmanager --licenses
          set -o pipefail

      - name: Set up Android NDK r12b
        run: |
          wget --quiet --tries=0 --output-document=android-ndk.zip https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux-x86_64.zip
          unzip -qq android-ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV
          # host image-ის preset ANDROID_NDK_ROOT წაშლილ NDK-ზე მიუთითებს —
          # make-standalone-toolchain.sh ამაზე ეცემა ("does not point to a directory")
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV

      - name: Set up CMake 3.14.7
        run: |
          wget --quiet --tries=0 --output-document=cmake.tar.gz https://cmake.org/files/v3.14/cmake-3.14.7-Linux-x86_64.tar.gz
          tar xzf cmake.tar.gz
          echo "CMAKE_HOME=$PWD/cmake-3.14.7-Linux-x86_64" >> $GITHUB_ENV

      - name: Restore takthirdparty cache
        id: ttp-cache
        uses: actions/cache/restore@v4
        with:
          path: atak/takthirdparty/builds
          key: ttp-${{ runner.os }}-${{ env.ATAK_REF }}-${{ github.run_id }}
          restore-keys: ttp-${{ runner.os }}-${{ env.ATAK_REF }}-

      - name: Build native dependencies (takthirdparty)
        working-directory: atak
        run: |
          export PATH="$CMAKE_HOME/bin:$PATH"
          ./scripts/prebuild.sh
          df -h /
          # prebuild.sh-ს set -e არ აქვს და შეცდომებს ყლაპავს — artifact-ებს ვამოწმებთ
          for t in arm64-v8a armeabi-v7a x86; do
            libdir="takthirdparty/builds/android-$t-release/lib"
            if ! ls "$libdir"/libgdal* >/dev/null 2>&1; then
              echo "::error::takthirdparty artifacts missing for $t ($libdir/libgdal*)"
              exit 1
            fi
          done
          echo "✓ takthirdparty artifacts არსებობს სამივე არქიტექტურაზე"

      # cache ინახება მაშინაც კი, თუ მომდევნო ეტაპი (gradle) ჩავარდა —
      # 50-წუთიანი native build აღარ მეორდება ყოველ ცდაზე
      - name: Save takthirdparty cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: atak/takthirdparty/builds
          key: ttp-${{ runner.os }}-${{ env.ATAK_REF }}-${{ github.run_id }}

      - name: Restore signing keystore
        run: |
          mkdir -p custom/keys
          echo "${{ secrets.DHGM_KEYSTORE_B64 }}" | base64 -d > custom/keys/dhgm.keystore
          # build.gradle კითხულობს rootProject.file('local.properties')-ს →
          # ფაილი gradle root-შია (atak/atak/), გზები აბსოლუტური (file() app-dir-relative-ია)
          cat > atak/atak/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          cmake.dir=$CMAKE_HOME
          takDebugKeyFile=$GITHUB_WORKSPACE/custom/keys/dhgm.keystore
          takDebugKeyFilePassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takDebugKeyAlias=dhgm-debug
          takDebugKeyPassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takReleaseKeyFile=$GITHUB_WORKSPACE/custom/keys/dhgm.keystore
          takReleaseKeyFilePassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takReleaseKeyAlias=dhgm-release
          takReleaseKeyPassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          EOF

      - name: Assemble DHGM APK
        working-directory: atak/atak
        run: ./gradlew assembleCivRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHGM-civ-release
          path: atak/atak/ATAK/app/build/outputs/apk/**/*.apk
