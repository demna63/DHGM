# DHGM APK build — ATAK-CIV-ის ოფიციალური assemble CI-ის ადაპტაცია.
# ლოკალურად macOS-ზე ეს build შეუძლებელია (NDK r12b / takthirdparty = Linux-only),
# ამიტომ GCS-ის ანალოგიით: overlay ლოკალურად ვითარდება, APK აქ იწყობა.
#
# Container-ის გარეშე ვმუშაობთ (host runner + setup-java temurin 8):
# ATAK-ის 3-არქიტექტურიან native build-ს ~30GB სჭირდება, runner-ს კი ~14GB აქვს —
# ბალასტის წაშლა (dotnet, preinstalled Android, ghc…) მხოლოდ host-ზეა შესაძლებელი.
#
# საჭირო Secrets (repo Settings → Secrets and variables → Actions):
#   DHGM_KEYSTORE_B64  — base64 < custom/keys/dhgm.keystore
#   DHGM_KEYSTORE_PASS — პაროლი custom/keys/keystore.properties-დან
name: Build DHGM

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['custom/**', 'tools/apply-dhgm-overlay.sh', 'tools/gen-icons.py', 'bridge/**', 'plugin/**', '.github/workflows/build-dhgm.yml', 'VERSION']

env:
  ATAK_REF: "4.6.0.5"   # ATAK-CIV-ის pinned stable tag (default branch = main; გაზარდე შეგნებულად, ტესტით)

jobs:
  build:
    name: Assemble DHGM (CIV base)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space (runner ballast)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Checkout DHGM (overlay)
        uses: actions/checkout@v5

      - name: Bridge unit tests
        run: cd bridge && python3 -m unittest discover -s tests

      - name: Plugin JVM tests (BridgeTcpClient, HostPortParser)
        run: bash tools/run-plugin-jvm-tests.sh

      - name: Overlay invariants (source)
        run: python3 tools/check-overlay-invariants.py --source-only

      - name: Generate brand assets (icons + splash)
        run: |
          pip install -q cairosvg pillow
          python3 tools/gen-icons.py

      - name: Checkout ATAK-CIV
        run: |
          git lfs install
          git clone --depth 1 --branch "$ATAK_REF" --recurse-submodules \
            https://github.com/deptofdefense/AndroidTacticalAssaultKit-CIV.git atak
          cd atak && git lfs fetch && git lfs checkout

      - name: Apply DHGM overlay
        run: ./tools/apply-dhgm-overlay.sh

      - name: Overlay invariants (patches applied)
        run: python3 tools/check-overlay-invariants.py

      # ATAK_REF-ის აწევისას: removed/format-mismatch ბლოკავს, new/stale — ::warning.
      # იხ. docs/atak-upgrade.md
      - name: Translation sync (values-ka vs upstream)
        run: python3 tools/sync-ka-translations.py --check

      - name: Read DHGM version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            FILE_V="$(tr -d '[:space:]' < VERSION)"
            if [[ "$FILE_V" != "$V" ]]; then
              echo "::warning::VERSION ($FILE_V) != tag (v$V) — tag-ის ვერსია გამოიყენება; release-ისთვის: tools/release.sh $V"
            fi
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "DHGM version: $V"

      - name: Set up Python 3.10 (conan 1.59 + PyYAML wheels)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ant apg dos2unix autoconf automake g++ libtool patch make cmake ninja-build swig tcl unzip wget
          # conan venv-ში Python 3.10-ით — 3.12-ზე PyYAML წყაროდან ვერ იწყობა (Cython 3)
          python3.10 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/pip" install -q -U pip setuptools
          "$HOME/conan-venv/bin/pip" install -q conan==1.59.0
          echo "$HOME/conan-venv/bin" >> $GITHUB_PATH
          echo "ANDROID_COMPILE_SDK=29" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=29.0.3" >> $GITHUB_ENV
          echo "ANDROID_SDK_TOOLS=4333796" >> $GITHUB_ENV
          echo "NDK_VERSION=12b" >> $GITHUB_ENV

      - name: Set up Android SDK
        run: |
          wget --quiet --tries=0 --output-document=android-sdk.zip https://dl.google.com/android/repository/sdk-tools-linux-${ANDROID_SDK_TOOLS}.zip
          unzip -qq -d android-sdk-linux android-sdk.zip
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          echo y | android-sdk-linux/tools/bin/sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" >/dev/null
          echo y | android-sdk-linux/tools/bin/sdkmanager "platform-tools" >/dev/null
          echo y | android-sdk-linux/tools/bin/sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}" >/dev/null
          echo "ANDROID_HOME=$PWD/android-sdk-linux" >> $GITHUB_ENV
          # host image-ის preset ANDROID_SDK_ROOT წაშლილ /usr/local/lib/android-ზე მიუთითებს
          echo "ANDROID_SDK_ROOT=$PWD/android-sdk-linux" >> $GITHUB_ENV
          echo "$PWD/android-sdk-linux/platform-tools/" >> $GITHUB_PATH
          set +o pipefail
          yes | android-sdk-linux/tools/bin/sdkmanager --licenses
          set -o pipefail

      - name: Set up Android NDK r12b
        run: |
          wget --quiet --tries=0 --output-document=android-ndk.zip https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux-x86_64.zip
          unzip -qq android-ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV
          # host image-ის preset ANDROID_NDK_ROOT წაშლილ NDK-ზე მიუთითებს —
          # make-standalone-toolchain.sh ამაზე ეცემა ("does not point to a directory")
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r${NDK_VERSION}" >> $GITHUB_ENV

      - name: Set up CMake 3.14.7
        run: |
          wget --quiet --tries=0 --output-document=cmake.tar.gz https://cmake.org/files/v3.14/cmake-3.14.7-Linux-x86_64.tar.gz
          tar xzf cmake.tar.gz
          echo "CMAKE_HOME=$PWD/cmake-3.14.7-Linux-x86_64" >> $GITHUB_ENV

      - name: Restore takthirdparty + conan cache
        id: ttp-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            atak/takthirdparty/builds
            ~/.conan
          key: ttp-${{ runner.os }}-${{ env.ATAK_REF }}-${{ github.run_id }}
          restore-keys: ttp-${{ runner.os }}-${{ env.ATAK_REF }}-

      - name: Build native dependencies (takthirdparty)
        id: ttp-build
        working-directory: atak
        run: |
          export PATH="$CMAKE_HOME/bin:$PATH"
          HAVE_LIBS=0
          ls takthirdparty/builds/android-arm64-v8a-release/lib/libgdal* >/dev/null 2>&1 && HAVE_LIBS=1

          if [ "$HAVE_LIBS" = 1 ]; then
            # native libs cached → make გამოვტოვოთ (touch), მაგრამ prebuild.sh მაინც საჭიროა:
            # conan export-pkg + publishToMavenLocal (~/.m2). ~/.m2 CI cache-ში არ ინახება —
            # სრული skip → gradle localhost:80-ზე ეცემა (libLAS/takthirdparty pom).
            echo "native cache hit — make გამოტოვდება, conan+maven republish"
            sed -i '/# Make the third party parts in parallel/i find ../takthirdparty/builds -print0 2>/dev/null | xargs -0 touch 2>/dev/null || true' scripts/prebuild.sh
            ./scripts/prebuild.sh
          else
            echo "cache miss — სრული native build"
            ./scripts/prebuild.sh
          fi
          df -h /
          # უსაფრთხოების ბადე: artifact-ები უნდა არსებობდეს (ცრუ success ვერ გაგვატყუებს)
          for t in arm64-v8a armeabi-v7a x86; do
            libdir="takthirdparty/builds/android-$t-release/lib"
            if ! ls "$libdir"/libgdal* >/dev/null 2>&1; then
              echo "::error::takthirdparty artifacts missing for $t ($libdir/libgdal*)"
              exit 1
            fi
          done
          echo "✓ takthirdparty artifacts არსებობს სამივე არქიტექტურაზე"
          echo "ttp_verified=1" >> "$GITHUB_OUTPUT"

      # cache ინახება gradle-ის ჩავარდნისასაც, მაგრამ ᲛᲮᲝᲚᲝᲓ მაშინ, როცა native
      # artifacts გადამოწმებულია (ttp_verified) — cancelled/ნაწილობრივი run ვეღარ
      # შეინახავს მოწამლულ cache-ს (2026-07-05-ის ინციდენტის root-cause fix).
      - name: Save takthirdparty + conan cache
        if: always() && steps.ttp-build.outputs.ttp_verified == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            atak/takthirdparty/builds
            ~/.conan
          key: ttp-${{ runner.os }}-${{ env.ATAK_REF }}-${{ github.run_id }}

      - name: Restore signing keystore
        run: |
          mkdir -p custom/keys
          echo "${{ secrets.DHGM_KEYSTORE_B64 }}" | base64 -d > custom/keys/dhgm.keystore
          # build.gradle კითხულობს rootProject.file('local.properties')-ს →
          # ფაილი gradle root-შია (atak/atak/), გზები აბსოლუტური (file() app-dir-relative-ია)
          cat > atak/atak/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          cmake.dir=$CMAKE_HOME
          takDebugKeyFile=$GITHUB_WORKSPACE/custom/keys/dhgm.keystore
          takDebugKeyFilePassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takDebugKeyAlias=dhgm-debug
          takDebugKeyPassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takReleaseKeyFile=$GITHUB_WORKSPACE/custom/keys/dhgm.keystore
          takReleaseKeyFilePassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takReleaseKeyAlias=dhgm-release
          takReleaseKeyPassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          EOF

      - name: Assemble DHGM APK
        working-directory: atak/atak
        run: |
          # ოფიციალური ATAK CI-ის იდენტური თანმიმდევრობა (assemble-sdk.yml):
          # 1) JNI header-ები javah-ით (AGP hook ავტომატურად არ ეშვება)
          # 2) civSdk ვარიანტი — assembleCivRelease-ისგან განსხვავებით configureConan-ის
          #    remote-ს (შიდა TAK repo) არ ითხოვს; ესაა tak.gov-ის გავრცელებადი ვარიანტიც
          ./gradlew generateJniHeaders
          ./gradlew assembleCivSdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHGM-${{ steps.ver.outputs.version }}-civ-sdk
          path: atak/atak/ATAK/app/build/outputs/apk/**/*.apk

      # ── ფაზა 2: DHGM Drones plugin (იმავე job-ში, app-ის SDK-ს იყენებს) ──
      - name: Prepare plugin SDK (takdev offline)
        id: pluginsdk
        continue-on-error: true
        run: |
          SDK=plugin/dhgm-drones/sdk
          mkdir -p "$SDK"
          # main.jar (plugin API) + atak.apk — civSdk build-ის პროდუქტები
          cp atak/atak/ATAK/app/build/libs/main.jar "$SDK/" 2>/dev/null || echo "::warning::main.jar ვერ მოიძებნა"
          APK=$(find atak/atak/ATAK/app/build/outputs/apk/civ/sdk -name "*.apk" | head -1)
          cp "$APK" "$SDK/atak.apk" 2>/dev/null || echo "::warning::atak.apk ვერ მოიძებნა"
          # atak-gradle-takdev.jar — წყაროა atak repo-ში, ვაშენებთ jar-ს
          if [ -f atak/atak-gradle-takdev/gradlew ]; then
            (cd atak/atak-gradle-takdev && chmod +x gradlew && ./gradlew jar --offline 2>/dev/null || ./gradlew jar)
            find atak/atak-gradle-takdev -name "*.jar" -path "*build/libs*" -exec cp {} atak/atak-gradle-takdev.jar \; 2>/dev/null || echo "::warning::takdev jar build ვერ მოხერხდა"
          fi
          ls -la atak/atak-gradle-takdev.jar 2>/dev/null || echo "::warning::atak-gradle-takdev.jar არ არსებობს"
          # gradle wrapper (atak-იდან) + local.properties (signing + sdk.path)
          cp -r atak/atak/gradle plugin/dhgm-drones/ 2>/dev/null || true
          cp atak/atak/gradlew plugin/dhgm-drones/ 2>/dev/null || true
          cat > plugin/dhgm-drones/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          sdk.path=$GITHUB_WORKSPACE/plugin/dhgm-drones/sdk
          takDebugKeyFile=$GITHUB_WORKSPACE/custom/keys/dhgm.keystore
          takDebugKeyFilePassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takDebugKeyAlias=dhgm-debug
          takDebugKeyPassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takReleaseKeyFile=$GITHUB_WORKSPACE/custom/keys/dhgm.keystore
          takReleaseKeyFilePassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          takReleaseKeyAlias=dhgm-release
          takReleaseKeyPassword=${{ secrets.DHGM_KEYSTORE_PASS }}
          EOF
          ls -la "$SDK"

      - name: Build DHGM Drones plugin
        id: pluginbuild
        continue-on-error: true
        working-directory: plugin/dhgm-drones
        run: |
          chmod +x gradlew || true
          ./gradlew assembleCivRelease -PdhgmVersion=${{ steps.ver.outputs.version }} --stacktrace

      - name: Upload plugin APK
        if: steps.pluginbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DHGM-Drones-plugin-${{ steps.ver.outputs.version }}
          path: plugin/dhgm-drones/app/build/outputs/apk/**/*.apk

      # release asset-ებს სუფთა, ვერსიით სახელი დაერქვას (gradle-ის ნედლი
      # DHGM-4.6.0.5-<hash>-civ-sdk.apk → DHGM-<ver>-app.apk).
      - name: Stage release assets (clean names)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          APP=$(find atak/atak/ATAK/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APP" ]; then
            cp "$APP" "dist/DHGM-${{ steps.ver.outputs.version }}-app.apk"
          else
            echo "::error::app APK ვერ მოიძებნა"; exit 1
          fi
          PLUG=$(find plugin/dhgm-drones/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$PLUG" ]; then
            cp "$PLUG" "dist/DHGM-Drones-${{ steps.ver.outputs.version }}.apk"
          else
            echo "::warning::plugin APK ვერ მოიძებნა — release app-ის გარეშე გამოვა"
          fi
          ls -la dist

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DHGM v${{ steps.ver.outputs.version }}
          files: |
            dist/*.apk
          generate_release_notes: true
          body: |
            # DHGM v${{ steps.ver.outputs.version }} — DroneHub Georgia Map

            ATAK-CIV-ის ბაზაზე, ქართული ლოკალიზაციით + DroneHub GCS ტელემეტრია.

            ## ინსტალაცია
            1. **app** (`DHGM-${{ steps.ver.outputs.version }}-app.apk`) — ძველი ATAK/DHGM ჯერ წაშალე.
            2. **plugin** (`DHGM-Drones-${{ steps.ver.outputs.version }}.apk`) — Plugin Management-ში „დრონები" ჩართე.
            3. bridge: `python3 bridge/dhgm_bridge.py --sim --plugin-tcp 0.0.0.0:14550`

            იხ. [docs/usage.md](https://github.com/demna63/DHGM/blob/main/docs/usage.md).

            ⚠️ APK-ები ჩვენი self-signed key-ითაა — Play Protect შეიძლება გააფრთხილოს („Install anyway").
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
