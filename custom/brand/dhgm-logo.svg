<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DroneHub navy ფონი (bgElevated-თან ახლოს), მომრგვალებული -->
  <rect width="512" height="512" rx="104" fill="#1E2E4F"/>
  <!-- თეთრი "D": counter (ხვრელი) evenodd-ით ფონს აჩვენებს (navy) -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M156 104 H252 A156 156 0 0 1 252 416 H156 Z
    M216 172 H252 A96 96 0 0 1 252 348 H216 Z
  "/>
  <!-- teal ისარი (play) მარცხენა ტანში, navy ღრიჭოთი -->
  <polygon fill="#17A79A" points="158,210 158,302 250,256"/>
  <rect x="158" y="250" width="140" height="12" transform="rotate(-16 158 256)" fill="#1E2E4F"/>
</svg>
