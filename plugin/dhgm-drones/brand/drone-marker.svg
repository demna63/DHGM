<?xml version="1.0" encoding="UTF-8"?>
<!--
  DroneHub GCS — map vehicle marker (top-down), body centered in 96×96 canvas.
  0° = nose toward north (up). ATAK: Icon ANCHOR_CENTER + STYLE_ROTATE_HEADING → spins in place.
  Colors: Theme.qml brandPrimary #0A84FF, brandAccent #30D158, bgBase #0B0E14.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Drone position">
  <title>Drone marker</title>
  <g transform="translate(0 18)">
    <g stroke="#000000" stroke-opacity="0.55" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M48 14 L62 24 V40 L48 50 L34 40 V24 Z" fill="none"/>
      <circle cx="48" cy="32" r="5.5" fill="#0B0E14"/>
      <line x1="48" y1="32" x2="28" y2="18"/><line x1="48" y1="32" x2="68" y2="18"/>
      <line x1="48" y1="32" x2="28" y2="46"/><line x1="48" y1="32" x2="68" y2="46"/>
      <circle cx="28" cy="18" r="7"/><circle cx="68" cy="18" r="7"/>
      <circle cx="28" cy="46" r="7"/><circle cx="68" cy="46" r="7"/>
      <polygon points="48,8 54,20 42,20"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#0A84FF" stroke="#FFFFFF">
      <path d="M48 14 L62 24 V40 L48 50 L34 40 V24 Z" fill="none" stroke-width="2.4"/>
      <polygon points="48,8 54,20 42,20" fill="#30D158" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="48" cy="32" r="5.5" fill="#0A84FF"/>
      <g stroke="#0A84FF" stroke-width="3" fill="none">
        <line x1="48" y1="32" x2="28" y2="18"/>
        <line x1="48" y1="32" x2="68" y2="18"/>
        <line x1="48" y1="32" x2="28" y2="46"/>
        <line x1="48" y1="32" x2="68" y2="46"/>
      </g>
      <g fill="#0B0E14" stroke="#0A84FF" stroke-width="2">
        <circle cx="28" cy="18" r="7"/>
        <circle cx="68" cy="18" r="7"/>
        <circle cx="28" cy="46" r="7"/>
        <circle cx="68" cy="46" r="7"/>
      </g>
      <circle cx="70" cy="12" r="4.5" fill="#30D158" stroke="#FFFFFF" stroke-width="1.6"/>
    </g>
    </g>
